<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Автодиагностика — экспертная система</title><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><a class="brand" href="/" aria-label="На главную"><span class="brand-mark" aria-hidden="true">А</span>Автодиагностика</a><button id="knowledge-toggle" class="text-button">База знаний</button></header>
  <main id="app" tabindex="-1"></main>
  <div id="error" role="alert" hidden></div>
  <footer>Учебная экспертная система · Предварительная диагностика по наблюдаемым признакам</footer>
  <dialog id="knowledge-dialog" aria-labelledby="knowledge-title">
    <div class="dialog-header"><h2 id="knowledge-title">База знаний</h2><button id="close-dialog" class="text-button">Закрыть</button></div>
    <p>60 правил. Промежуточные правила выбирают ветку; конечные описывают возможную причину.</p>
    <label class="search-label">Поиск по правилам<input id="rule-search" type="search" placeholder="Например, сцепление"></label>
    <div id="rule-list"></div>
  </dialog>
</body>
</html>
